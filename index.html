<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nexus Protocol</title>
    <style>
      :root {
        --accent: #00e5ff;
        --good: #38d47a;
        --warn: #e8b23a;
        --bad: #ef4444;
        --persuaded: #22d3ee;
        --gold: #facc15;
        /* UI chrome is responsive up to a max aspect of 16:9: wider windows
           pillarbox it into a centered band, narrower ones use the full
           viewport. The 3D canvas and world-tracking overlays (nameplates,
           offscreen arrows, selection box) stay full-window */
        --ui-inset-x: max(0px, calc((100vw - (16 / 9) * 100vh) / 2));
      }
      /* the small-screen layouts predate the 16:9 cap and must not shift */
      @media (max-width: 760px) {
        :root {
          --ui-inset-x: 0px;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0d14;
        font-family: 'Menlo', 'Consolas', monospace;
        user-select: none;
      }
      #app {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        inset: 0 var(--ui-inset-x);
        pointer-events: none;
        color: #b9c4d6;
        font-size: 12px;
      }
      /* interactive-overlay contract: the HUD container never eats world
         input; only explicit controls opt back in */
      #hud [data-act],
      #hud .panpad {
        pointer-events: auto;
      }
      #hud button[data-act] {
        background: #14202f;
        color: #c7d2e4;
        border: 1px solid #24354d;
        border-radius: 0;
        font: inherit;
        font-size: 10px;
        letter-spacing: 1px;
        text-transform: uppercase;
        padding: 4px 8px;
        margin: 0;
        cursor: pointer;
        min-width: 34px;
      }
      #hud button[data-act]:hover:not(:disabled) { border-color: var(--accent); color: #fff; }
      #hud button[data-act].on {
        background: #063c46;
        border-color: var(--accent);
        color: #aff6ff;
      }
      #hud button[data-act].pressed { background: #0a5666; border-color: #aff6ff; color: #fff; }
      #hud button[data-act]:disabled {
        opacity: 0.35;
        border-color: #1a2635;
        cursor: default;
      }
      .hud-ctl {
        position: absolute;
        right: 12px;
        top: 44px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-end;
        font-size: 10px;
      }
      .hud-ctl .ctlrow { display: flex; gap: 4px; }
      .hud-ctl .ctllabel {
        color: #55627a;
        font-size: 9px;
        letter-spacing: 1.5px;
        align-self: flex-end;
        margin-top: 3px;
      }
      .railbox {
        position: relative;
        background: rgba(9, 14, 23, 0.85);
        border: 1px solid #24354d;
        padding: 8px 10px;
      }
      .modes button { min-width: 66px; }
      .ordergrid {
        display: grid;
        grid-template-columns: repeat(3, 58px);
        gap: 4px;
      }
      #hud .ordergrid button[data-act] {
        min-width: 0;
        height: 46px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 3px 0;
      }
      .ordergrid svg { width: 16px; height: 16px; }
      .ordergrid i { font-style: normal; font-size: 8px; letter-spacing: 1px; color: #7d8aa0; }
      #hud .ordergrid button.on i,
      #hud .ordergrid button:hover:not(:disabled) i { color: inherit; }
      .speedbar {
        position: fixed;
        right: calc(12px + var(--ui-inset-x));
        bottom: 8px;
        display: flex;
        gap: 4px;
      }
      .panpad {
        display: grid;
        grid-template-columns: repeat(3, 28px);
        grid-template-rows: repeat(2, 24px);
        gap: 3px;
      }
      .panpad button[data-act] { min-width: 0; padding: 2px 0; }
      .panpad .pu { grid-column: 2; grid-row: 1; }
      .panpad .pl { grid-column: 1; grid-row: 2; }
      .panpad .pd { grid-column: 2; grid-row: 2; }
      .panpad .pr { grid-column: 3; grid-row: 2; }
      .panpad .rl { grid-column: 1; grid-row: 1; }
      .panpad .rr { grid-column: 3; grid-row: 1; }
      /* nameplates: projected in-world labels, never interactive */
      #nameplates {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 12;
        overflow: hidden;
      }
      .plate {
        position: absolute;
        transform: translate(-50%, -100%);
        background: rgba(10, 16, 26, 0.78);
        border: 1px solid #24354d;
        color: #c7d2e4;
        font-size: 10px;
        letter-spacing: 1.2px;
        padding: 1px 6px;
        white-space: nowrap;
      }
      .plate.sel { border-color: var(--accent); color: #e8fbff; }
      .plate.sel::before { content: '\25B8 '; color: var(--accent); }
      .plate.wound { border-color: var(--plate-wound); color: var(--plate-wound); }
      .plate.down {
        border-color: var(--plate-down);
        color: var(--plate-down);
        text-decoration: line-through;
        opacity: 0.8;
      }
      .hud-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 7px 12px;
        background: linear-gradient(180deg, rgba(8, 12, 20, 0.92), rgba(8, 12, 20, 0.55));
        border-bottom: 1px solid #1a2635;
      }
      .hud-top .spacer { flex: 1; }
      .op {
        color: #e8eef8;
        letter-spacing: 1px;
        border-left: 3px solid var(--accent);
        padding: 2px 0 2px 8px;
      }
      .alarm { padding: 2px 8px; letter-spacing: 1px; color: #8fa3bd; }
      .alarm.a0 b { color: var(--good); }
      .alarm.a1 b { color: var(--warn); }
      .alarm.a2 b { color: var(--bad); }
      .inf { color: #8fa3bd; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
      .inf b { color: var(--persuaded); }
      .meter {
        display: inline-block;
        width: 90px;
        height: 6px;
        background: #1a2433;
        position: relative;
        overflow: hidden;
      }
      .meter i {
        display: block;
        height: 100%;
        background: var(--persuaded);
        transition: width 0.4s;
      }
      .meter::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(90deg, transparent 0 8px, #0a0d14 8px 9px);
      }
      .clock { color: #c7d2e4; letter-spacing: 1px; }
      .pausechip {
        color: var(--gold);
        border: 1px solid var(--gold);
        padding: 2px 8px;
        letter-spacing: 1px;
      }
      .simchip { color: var(--warn); letter-spacing: 1px; }
      .status { color: var(--gold); font-size: 15px; font-weight: bold; padding: 2px 10px; }
      #hud button.icobtn[data-act] { min-width: 0; padding: 3px 6px; line-height: 0; }
      .icobtn svg { width: 13px; height: 13px; }
      .panel-box {
        position: absolute;
        background: rgba(9, 14, 23, 0.85);
        border: 1px solid #24354d;
        padding: 8px 10px;
      }
      .panel-box::before {
        content: '';
        position: absolute;
        top: -1px;
        left: -1px;
        width: 8px;
        height: 8px;
        border-top: 2px solid var(--accent);
        border-left: 2px solid var(--accent);
      }
      .panel-box::after {
        content: '';
        position: absolute;
        bottom: -1px;
        right: -1px;
        width: 8px;
        height: 8px;
        border-bottom: 2px solid var(--accent);
        border-right: 2px solid var(--accent);
      }
      .panel-box h4,
      .railbox h4 {
        margin: 0 0 6px;
        font-size: 9px;
        font-weight: normal;
        letter-spacing: 2px;
        color: #55627a;
      }
      .railbox h4:not(:first-child) { margin-top: 8px; }
      .hud-obj { top: 44px; left: 12px; min-width: 180px; max-width: 240px; }
      .hud-obj ul { margin: 0; padding: 0 0 0 14px; color: #c7d2e4; }
      .hud-obj li { margin: 2px 0; }
      .hud-obj h4:not(:first-child) { margin-top: 8px; }
      .fmodes { list-style: none; }
      .hud-obj ul.fmodes { padding-left: 0; }
      .fmodes .fm { letter-spacing: 0.5px; }
      .fmodes .fm em { font-style: normal; color: #55627a; }
      .fmodes .fm b { color: inherit; }
      .fmodes .fm0 { color: #55627a; }
      .fmodes .fm1 { color: var(--warn); }
      .fmodes .fm1 em { color: var(--warn); }
      .fmodes .fm2 { color: var(--bad); }
      .fmodes .fm2 em { color: var(--bad); }
      #hud .abortbtn { margin-top: 8px; width: 100%; }
      #hud .abortbtn.on { border-color: var(--warn); color: var(--warn); }
      .hud-sys { left: 12px; bottom: 34px; width: 200px; }
      .syswave {
        display: block;
        background: rgba(10, 16, 26, 0.6);
        border: 1px solid #1a2635;
        margin-bottom: 6px;
      }
      .systabs { display: flex; gap: 3px; }
      #hud .systabs button[data-act] { min-width: 0; flex: 1; padding: 3px 0; font-size: 9px; }
      .hud-agents {
        position: absolute;
        left: 236px;
        right: 236px;
        bottom: 34px;
        display: flex;
        gap: 8px;
      }
      #hud .acard { display: flex; gap: 8px; }
      .portrait {
        width: 46px;
        height: 58px;
        object-fit: cover;
        border: 1px solid #24354d;
        background: #0a0f18;
      }
      .agent.sel .portrait { border-color: var(--accent); }
      .abody { flex: 1; min-width: 0; overflow: hidden; }
      .blabel {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 8px;
        letter-spacing: 1.5px;
        color: #55627a;
        margin-top: 4px;
      }
      .blabel b { color: #8fa3bd; font-weight: normal; letter-spacing: 0.5px; }
      .hpbar.focus i { background: var(--persuaded); }
      .akit .chip { color: #8fa3bd; border: 1px solid #24354d; padding: 1px 4px; font-size: 9px; }
      .akit .wpn svg { width: 18px; height: 13px; vertical-align: -3px; margin-right: 3px; }
      .agent {
        background: linear-gradient(180deg, rgba(14, 22, 36, 0.92), rgba(9, 14, 23, 0.88));
        border: 1px solid #24354d;
        border-top: 2px solid #31465f;
        padding: 6px 9px 7px;
        flex: 1 1 160px;
        min-width: 0;
        max-width: 215px;
      }
      .agent.sel { border-color: var(--accent); border-top-color: var(--accent); box-shadow: 0 0 12px rgba(0, 229, 255, 0.18); }
      .agent.dead { opacity: 0.45; border-top-color: var(--bad); }
      .arow { display: flex; align-items: baseline; gap: 7px; }
      .arow b { color: #e8eef8; letter-spacing: 1px; }
      .ahp { color: #b9c4d6; font-size: 11px; }
      .arow em {
        font-style: normal;
        font-size: 9px;
        letter-spacing: 0.5px;
        padding: 1px 4px;
        border: 1px solid currentcolor;
      }
      .b-cloak { color: var(--persuaded); }
      .b-jam { color: var(--bad); }
      .b-drive { color: var(--warn); }
      .b-shield { color: var(--accent); }
      .akit {
        display: flex;
        gap: 4px;
        align-items: center;
        color: #7d8aa0;
        font-size: 10px;
        margin-top: 4px;
        white-space: nowrap;
      }
      .akit .wpn { color: #a8b6cc; }
      .akit .agg { color: #8fa3bd; letter-spacing: 0.5px; }
      /* card controls stay chip-sized so the cards keep their footprint */
      #hud .akit button[data-act] {
        padding: 1px 4px;
        min-width: 0;
        font-size: 9px;
        letter-spacing: 0.5px;
      }
      #hud .akit button.wpn[data-act] { color: #a8b6cc; }
      #hud .akit button.agg[data-act] { color: #8fa3bd; }
      .hpbar {
        display: block;
        height: 3px;
        background: #26303f;
        margin-top: 4px;
      }
      .hpbar i {
        display: block;
        height: 3px;
        background: var(--good);
        transition: width 0.25s;
      }
      .hpbar.low i { background: var(--warn); }
      .hpbar.crit i { background: var(--bad); }
      .hud-help {
        position: absolute;
        bottom: 8px;
        left: 12px;
        right: 260px;
        display: none;
        flex-wrap: wrap;
        gap: 4px 14px;
        color: #55627a;
        font-size: 10px;
      }
      #hud.show-help .hud-help { display: flex; }
      .kgroup { white-space: nowrap; }
      .kgroup b {
        color: #8fa3bd;
        font-weight: normal;
        background: #131c2b;
        border: 1px solid #24354d;
        border-radius: 2px;
        padding: 0 4px;
        margin: 0 4px 0 10px;
      }
      .kgroup b:first-child { margin-left: 0; }
      .minimap {
        position: fixed;
        right: 12px;
        bottom: 34px;
        z-index: 15;
        pointer-events: none;
        border: 1px solid #24354d;
        background: #0a0d14;
        opacity: 0.92;
      }
      .minimap-wrap {
        position: fixed;
        right: calc(12px + var(--ui-inset-x));
        bottom: 40px;
        z-index: 15;
        padding: 6px 8px 8px;
      }
      .minimap-wrap h4 {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 5px;
      }
      .mmz { display: flex; gap: 3px; }
      #hud .mmz button[data-act] { min-width: 22px; padding: 0 4px; font-size: 11px; }
      .minimap-wrap .minimap {
        position: static;
        display: block;
        border: 1px solid #1a2635;
      }
      @media (max-width: 700px) {
        /* keyboard hints are meaningless on touch-size viewports and the
           bottom band gets crowded: shrink the minimap, tighten the cards */
        .hud-help,
        #hud.show-help .hud-help { display: none; }
        .hud-sys { display: none; }
        .minimap { width: 104px; height: 104px; }
        .minimap-wrap { bottom: 44px; }
        .hud-agents {
          left: 8px;
          right: 130px;
          bottom: 40px;
          flex-wrap: wrap;
          gap: 5px;
        }
        .agent { min-width: 100px; padding: 4px 6px; }
        .portrait { display: none; }
        .akit { gap: 5px; font-size: 9px; }
        .ordergrid { grid-template-columns: repeat(3, 44px); }
        #hud .ordergrid button[data-act] { height: 38px; }
        .ordergrid i { display: none; }
      }
      .comms {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 130px;
        z-index: 16;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: center;
      }
      .commline {
        color: #e8eef8;
        background: rgba(10, 16, 26, 0.85);
        border-left: 3px solid var(--accent);
        padding: 5px 12px;
        font-size: 12px;
        opacity: 1;
        transition: opacity 0.6s;
      }
      .offarrow {
        position: fixed;
        width: 0;
        height: 0;
        border: 8px solid transparent;
        border-left-width: 14px;
        pointer-events: none;
        z-index: 14;
        transform-origin: 50% 50%;
      }
      .selbox {
        position: fixed;
        border: 1px solid var(--accent);
        background: rgba(0, 229, 255, 0.08);
        pointer-events: none;
        z-index: 10;
      }
      #screen {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(6, 9, 14, 0.94);
        color: #c7d2e4;
        z-index: 20;
        overflow: auto;
      }
      #screen * { scrollbar-width: thin; scrollbar-color: #24354d transparent; }
      #screen ::-webkit-scrollbar { width: 8px; height: 8px; }
      #screen ::-webkit-scrollbar-thumb { background: #24354d; }
      #screen ::-webkit-scrollbar-track { background: transparent; }
      .panel {
        max-width: 860px;
        width: 92%;
        max-height: 92vh;
        overflow: auto;
        background: #0c111b;
        border: 1px solid #24354d;
        border-top: 3px solid var(--accent);
        padding: 22px 28px;
      }
      .panel h1 {
        font-size: 40px;
        letter-spacing: 6px;
        color: #e8eef8;
        margin: 0 0 4px;
      }
      .panel h1 span { color: var(--accent); margin-left: 10px; }
      .panel h2 { color: #e8eef8; letter-spacing: 2px; margin: 0; font-size: 19px; }
      .panel h3 {
        display: flex;
        align-items: baseline;
        gap: 10px;
        color: #7d8aa0;
        font-size: 11px;
        font-weight: normal;
        letter-spacing: 2px;
        margin: 18px 0 8px;
      }
      .panel h3::after { content: ''; flex: 1; height: 1px; background: #1b2940; align-self: center; }
      .h3tag { color: #45526b; font-size: 9px; letter-spacing: 1px; }
      .panel .tag { color: #7d8aa0; }
      .panel .fine { color: #45526b; font-size: 10px; margin-top: 24px; }
      .panel button,
      .pop button,
      .drawer button,
      .btnbar button {
        display: inline-block;
        background: #14202f;
        color: #c7d2e4;
        border: 1px solid #2c4058;
        border-radius: 0;
        font: inherit;
        letter-spacing: 1px;
        padding: 8px 16px;
        margin: 6px 6px 0 0;
        cursor: pointer;
      }
      .panel button:hover:not(:disabled),
      .pop button:hover:not(:disabled),
      .drawer button:hover:not(:disabled),
      .btnbar button:hover:not(:disabled) { border-color: var(--accent); color: #fff; }
      .panel button:disabled,
      .pop button:disabled,
      .drawer button:disabled,
      .btnbar button:disabled { opacity: 0.35; cursor: default; }
      .panel button.primary,
      .pop button.primary,
      .btnbar button.primary { background: #063c46; border-color: var(--accent); color: #aff6ff; }
      .panel button.primary:hover:not(:disabled),
      .pop button.primary:hover:not(:disabled),
      .btnbar button.primary:hover:not(:disabled) { background: #0a5666; color: #fff; }
      #screen button:active:not(:disabled) { transform: translateY(1px); }
      #screen button:focus-visible,
      #screen input:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
      /* segmented option group: exactly one segment carries .on */
      .seg { display: inline-flex; flex-wrap: wrap; }
      .seg button { margin: 0 0 0 -1px; padding: 6px 14px; font-size: 11px; }
      .seg button:first-child { margin-left: 0; }
      .seg button.on {
        background: #063c46;
        border-color: var(--accent);
        color: #aff6ff;
        position: relative;
        z-index: 1;
      }
      /* themed range slider; --fill mirrors the value so the track reads as a meter */
      #screen input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        height: 16px;
        background: transparent;
        cursor: pointer;
        min-width: 90px;
        margin: 0;
      }
      #screen input[type='range']::-webkit-slider-runnable-track {
        height: 4px;
        background: linear-gradient(90deg, var(--accent) var(--fill, 50%), #1c2942 var(--fill, 50%));
      }
      #screen input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 9px;
        height: 14px;
        margin-top: -5px;
        background: var(--accent);
        box-shadow: 0 0 7px rgba(0, 229, 255, 0.55);
      }
      #screen input[type='range']::-moz-range-track { height: 4px; background: #1c2942; }
      #screen input[type='range']::-moz-range-progress { height: 4px; background: var(--accent); }
      #screen input[type='range']::-moz-range-thumb {
        width: 9px;
        height: 14px;
        border: 0;
        border-radius: 0;
        background: var(--accent);
      }
      /* toggle switch (settings checkboxes) */
      .toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
      .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
      .tgl { flex: 0 0 auto; width: 34px; height: 16px; border: 1px solid #2c4058; background: #0a0f18; position: relative; }
      .tgl::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 10px;
        background: #45526b;
        transition: left 0.12s, background 0.12s;
      }
      .toggle input:checked + .tgl { border-color: var(--accent); background: rgba(0, 229, 255, 0.07); }
      .toggle input:checked + .tgl::after { left: 18px; background: var(--accent); box-shadow: 0 0 6px rgba(0, 229, 255, 0.5); }
      .toggle input:focus-visible + .tgl { outline: 1px solid var(--accent); outline-offset: 2px; }
      .tglval { font-style: normal; min-width: 26px; text-align: left; }
      .tglval::after { content: 'OFF'; color: #45526b; font-size: 9px; letter-spacing: 1px; }
      .toggle input:checked ~ .tglval::after { content: 'ON'; color: var(--accent); }
      /* horizontal meter (R&D thresholds) */
      .meterbar { flex: 1; height: 5px; background: #16233a; position: relative; min-width: 60px; }
      .meterbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
      .meterbar.done i { background: var(--good); }
      /* settings rows: label / control / value, stable widths */
      .setrow {
        display: grid;
        grid-template-columns: 260px 1fr 56px;
        gap: 8px 16px;
        align-items: center;
        min-height: 36px;
        padding: 6px 0;
      }
      .setlbl { color: #c7d2e4; font-size: 12px; letter-spacing: 0.5px; }
      .setlbl small { display: block; color: #45526b; font-size: 9.5px; letter-spacing: 0.3px; margin-top: 2px; }
      .setval {
        color: #e8eef8;
        font-weight: normal;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

        padding: 6px 0;

      .srow .max { color: var(--good); font-size: 9.5px; letter-spacing: 1px; text-align: center; padding: 6px 0; }
      .srow.locked .s-name { color: #45526b; }
      .srow.locked .s-name small { color: #333f52; }
      .srow.locked .s-stock { color: #45526b; }
      .srow.locked .tier { opacity: 0.5; }
      .pips { display: inline-flex; gap: 3px; }
      .pips i { width: 8px; height: 8px; border: 1px solid #2c4058; background: #141d2c; }
      .pips i.f { background: var(--persuaded); border-color: var(--persuaded); }
      .btnrow { margin-top: 16px; display: flex; justify-content: space-between; }
      /* debrief and campaign victory */
      .panel.debrief.fail { border-top-color: var(--bad); }
      .verdict { border-left: 4px solid var(--good); padding: 4px 0 6px 14px; margin-top: 4px; }
      .verdict small { display: block; color: #7d8aa0; font-size: 10px; letter-spacing: 2px; margin-bottom: 5px; }
      .verdict h2 { font-size: 26px; letter-spacing: 3px; }
      .verdict.good h2 { color: var(--good); }
      .verdict.bad { border-left-color: var(--bad); }
      .verdict.bad h2 { color: var(--bad); }
      .debrief .loglines,
      .victory .loglines {
        border: 1px solid #1b2940;
        background: #0a0f18;
        padding: 12px 16px;
        margin-top: 14px;
        max-height: 44vh;
        overflow: auto;
      }
      .dbstat { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 16px; }
      .dbstat span { color: #7d8aa0; font-size: 10px; letter-spacing: 1.5px; }
      .dbstat b { color: var(--gold); font-size: 15px; margin-left: 8px; font-variant-numeric: tabular-nums; }
      .panel.victory { border-top-color: var(--gold); }
      .victory h1 span { color: var(--gold); }
      .victory .loglines { text-align: left; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud"></div>
    <div id="screen"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nexus Protocol</title>
    <style>
      :root {
        --accent: #00e5ff;
        --good: #38d47a;
        --warn: #e8b23a;
        --bad: #ef4444;
        --persuaded: #22d3ee;
        --gold: #facc15;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0d14;
        font-family: 'Menlo', 'Consolas', monospace;
        user-select: none;
      }
      #app {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #b9c4d6;
        font-size: 12px;
      }
      .hud-top {
        position: absolute;
        top: 10px;
        left: 12px;
        right: 12px;
        display: flex;
        gap: 18px;
        align-items: center;
      }
      .obj {
        color: #e8eef8;
        background: rgba(10, 16, 26, 0.75);
        padding: 5px 10px;
        border-left: 3px solid var(--accent);
      }
      .alarm {
        padding: 4px 8px;
        background: rgba(10, 16, 26, 0.75);
      }
      .alarm.a0 { color: var(--good); }
      .alarm.a1 { color: var(--warn); }
      .alarm.a2 { color: var(--bad); }
      .inf { color: var(--persuaded); background: rgba(10, 16, 26, 0.75); padding: 4px 8px; }
      .status {
        color: var(--gold);
        font-size: 16px;
        font-weight: bold;
        background: rgba(10, 16, 26, 0.9);
        padding: 6px 14px;
      }
      .hud-agents {
        position: absolute;
        left: 12px;
        bottom: 34px;
        display: flex;
        gap: 8px;
      }
      .agent {
        background: linear-gradient(180deg, rgba(14, 22, 36, 0.92), rgba(9, 14, 23, 0.88));
        border: 1px solid #24354d;
        border-top: 2px solid #31465f;
        padding: 6px 9px 7px;
        min-width: 148px;
      }
      .agent.sel { border-color: var(--accent); border-top-color: var(--accent); box-shadow: 0 0 12px rgba(0, 229, 255, 0.18); }
      .agent.dead { opacity: 0.45; border-top-color: var(--bad); }
      .arow { display: flex; align-items: baseline; gap: 7px; }
      .arow b { color: #e8eef8; letter-spacing: 1px; }
      .ahp { color: #b9c4d6; font-size: 11px; }
      .arow em {
        font-style: normal;
        font-size: 9px;
        letter-spacing: 0.5px;
        padding: 1px 4px;
        border: 1px solid currentcolor;
      }
      .b-cloak { color: var(--persuaded); }
      .b-jam { color: var(--bad); }
      .b-drive { color: var(--warn); }
      .b-shield { color: var(--accent); }
      .akit {
        display: flex;
        gap: 8px;
        color: #7d8aa0;
        font-size: 10px;
        margin-top: 4px;
        white-space: nowrap;
      }
      .akit .wpn { color: #a8b6cc; }
      .akit .agg { color: #8fa3bd; letter-spacing: 0.5px; }
      .hpbar {
        display: block;
        height: 3px;
        background: #26303f;
        margin-top: 4px;
      }
      .hpbar i {
        display: block;
        height: 3px;
        background: var(--good);
        transition: width 0.25s;
      }
      .hpbar.low i { background: var(--warn); }
      .hpbar.crit i { background: var(--bad); }
      .hud-help {
        position: absolute;
        bottom: 8px;
        left: 12px;
        right: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        color: #55627a;
        font-size: 10px;
      }
      .kgroup { white-space: nowrap; }
      .kgroup b {
        color: #8fa3bd;
        font-weight: normal;
        background: #131c2b;
        border: 1px solid #24354d;
        border-radius: 2px;
        padding: 0 4px;
        margin: 0 4px 0 10px;
      }
      .kgroup b:first-child { margin-left: 0; }
      .minimap {
        position: fixed;
        right: 12px;
        bottom: 34px;
        z-index: 15;
        pointer-events: none;
        border: 1px solid #24354d;
        background: #0a0d14;
        opacity: 0.92;
      }
      @media (max-width: 700px) {
        /* keyboard hints are meaningless on touch-size viewports and the
           bottom band gets crowded: shrink the minimap, tighten the cards */
        .hud-help { display: none; }
        .minimap { width: 104px; height: 104px; bottom: 10px; }
        .hud-agents {
          left: 8px;
          right: 122px;
          bottom: 10px;
          flex-wrap: wrap;
          gap: 5px;
        }
        .agent { min-width: 100px; padding: 4px 6px; }
        .akit { gap: 5px; font-size: 9px; }
      }
      .comms {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 130px;
        z-index: 16;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: center;
      }
      .commline {
        color: #e8eef8;
        background: rgba(10, 16, 26, 0.85);
        border-left: 3px solid var(--accent);
        padding: 5px 12px;
        font-size: 12px;
        opacity: 1;
        transition: opacity 0.6s;
      }
      .offarrow {
        position: fixed;
        width: 0;
        height: 0;
        border: 8px solid transparent;
        border-left-width: 14px;
        pointer-events: none;
        z-index: 14;
        transform-origin: 50% 50%;
      }
      .selbox {
        position: fixed;
        border: 1px solid var(--accent);
        background: rgba(0, 229, 255, 0.08);
        pointer-events: none;
        z-index: 10;
      }
      #screen {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(6, 9, 14, 0.94);
        color: #c7d2e4;
        z-index: 20;
        overflow: auto;
      }
      .panel {
        max-width: 860px;
        width: 92%;
        max-height: 92vh;
        overflow: auto;
        background: #0c111b;
        border: 1px solid #24354d;
        border-top: 3px solid var(--accent);
        padding: 22px 28px;
      }
      .panel h1 {
        font-size: 40px;
        letter-spacing: 6px;
        color: #e8eef8;
        margin: 0 0 4px;
      }
      .panel h1 span { color: var(--accent); margin-left: 10px; }
      .panel h2 { color: #e8eef8; letter-spacing: 2px; margin: 0; }
      .panel h3 { color: #7d8aa0; font-size: 12px; letter-spacing: 2px; margin: 14px 0 6px; }
      .panel .tag { color: #7d8aa0; }
      .panel .fine { color: #45526b; font-size: 10px; margin-top: 24px; }
      .panel button {
        display: inline-block;
        background: #14202f;
        color: #c7d2e4;
        border: 1px solid #2c4058;
        font: inherit;
        padding: 8px 16px;
        margin: 6px 6px 0 0;
        cursor: pointer;
      }
      .panel button:hover:not(:disabled) { border-color: var(--accent); color: #fff; }
      .panel button:disabled { opacity: 0.35; cursor: default; }
      .panel button.primary { background: #063c46; border-color: var(--accent); color: #aff6ff; }
      .menu { text-align: center; }
      .menu button { display: block; margin: 10px auto 0; min-width: 260px; }
      .menu .logo {
        display: block;
        width: 190px;
        height: 142px;
        /* crop the baked-in wordmark off the square mark; the h1 supplies it */
        object-fit: cover;
        object-position: top;
        margin: 0 auto 6px;
        /* the generated mark ships on its own near-black plate; screen
           blending sinks the plate into the panel */
        mix-blend-mode: screen;
      }
      .topbar { display: flex; gap: 18px; align-items: center; margin-bottom: 12px; }
      .credits { color: var(--gold); font-weight: bold; }
      .regiontabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
      .regiontabs button { padding: 4px 10px; font-size: 11px; margin: 0; }
      .neutral { color: #7d8aa0; }
      .siege { color: var(--bad); font-weight: bold; letter-spacing: 1px; margin-bottom: 4px; }
      .hqtag { color: var(--gold); font-size: 10px; letter-spacing: 1px; }
      .sietag { color: var(--bad); font-size: 10px; letter-spacing: 1px; }
      .own { color: var(--good); }
      .riv { color: var(--bad); }
      .unrest.hot { color: var(--bad); }
      .taxrow { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
      .taxrow input { flex: 1; }
      .loglines { color: #5f86b0; font-size: 11px; margin-top: 12px; line-height: 1.7; }
      .panel.map { max-width: 1100px; width: 96%; padding: 0; display: flex; flex-direction: column; }
      .maphud {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        align-items: baseline;
        padding: 12px 16px;
        border-bottom: 1px solid #24354d;
        font-size: 12px;
      }
      .maphud h2 { font-size: 14px; }
      .maphud .cyc { margin-left: auto; color: #7d8aa0; }
      .panel.map .regiontabs { padding: 8px 16px 0; margin-bottom: 8px; }
      .panel.map .fine { margin: 0 16px 8px; }
      .stage {
        position: relative;
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        grid-auto-rows: minmax(68px, auto);
        gap: 10px;
        padding: 16px 16px 46px;
        background: radial-gradient(circle at 30% 40%, #0e1730 0%, #0a0f1c 60%);
      }
      .blk {
        grid-column: var(--gc);
        grid-row: var(--gr);
        border: 1px solid #24354d;
        background: #101a30;
        padding: 8px 9px;
        cursor: pointer;
        min-width: 0;
        overflow: hidden;
      }
      .blk .nm { font-size: 11px; letter-spacing: 0.06em; color: #8fa3bd; }
      .blk .cr { color: #c7d2e4; margin-top: 2px; font-size: 11.5px; }
      .blk.own { border-color: var(--good); box-shadow: inset 3px 0 0 var(--good); }
      .blk.riv { border-color: var(--bad); box-shadow: inset 3px 0 0 var(--bad); }
      .blk.sieged { border-style: dashed; }
      .blk.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
      .blk.filler { cursor: default; opacity: 0.55; }
      .blk.gate { border-style: dotted; }
      .blk.gate .nm { color: var(--accent); }
      .ubar { height: 4px; background: #1c2942; margin-top: 7px; }
      .ubar i { display: block; height: 100%; background: var(--good); }
      .ubar.hot i { background: var(--bad); }
      .fog {
        grid-column: var(--gc);
        grid-row: var(--gr);
        border: 1px dashed #24354d;
        display: grid;
        place-items: center;
        color: #4a5b76;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.1em;
        background: repeating-linear-gradient(45deg, #0c1322 0 8px, #0a0f1c 8px 16px);
      }
      .pop {
        position: absolute;
        right: 16px;
        top: 16px;
        width: 260px;
        background: #0c111b;
        border: 1px solid var(--accent);
        padding: 12px 14px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
        z-index: 2;
        font-size: 12px;
      }
      .pop h4 { margin: 0 0 2px; color: #e8eef8; font-size: 12.5px; letter-spacing: 0.05em; }
      .pop dl { margin: 10px 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 11.5px; }
      .pop dt { color: #7d8aa0; }
      .pop dd { margin: 0; text-align: right; }
      .pop button { width: 100%; margin: 6px 0 0; }
      .pop .fine { margin: 8px 0 0; }
      .legend {
        position: absolute;
        left: 16px;
        bottom: 12px;
        display: flex;
        gap: 14px;
        font-size: 10.5px;
        color: #8fa3bd;
      }
      .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; }
      .legend .k-own { background: var(--good); }
      .legend .k-riv { background: var(--bad); }
      .legend .k-neu { background: #24354d; }
      .drawer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
        padding: 9px 16px;
        border-top: 1px solid #24354d;
        color: #7d8aa0;
        font-size: 11.5px;
      }
      .drawer b { color: #c7d2e4; }
      .drawer input { flex: 1; min-width: 120px; }
      .drawer button { margin: 0; padding: 4px 10px; font-size: 11px; }
      .rdgrid { flex-basis: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 24px; font-size: 11px; }
      .rdgrid div { display: flex; align-items: center; gap: 6px; }
      .rdgrid progress { flex: 1; height: 6px; }
      .ticker {
        padding: 8px 16px;
        border-top: 1px solid #24354d;
        color: #5f86b0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 11.5px;
      }
      @media (max-width: 700px) {
        .maphud { font-size: 11px; gap: 4px 12px; }
        .maphud .cyc { margin-left: 0; flex-basis: 100%; }
        .stage { grid-template-columns: 1fr 1fr; padding-bottom: 16px; }
        .blk, .fog { grid-column: auto; grid-row: auto; min-height: 56px; }
        .blk.filler { display: none; }
        .fog { grid-column: 1 / -1; }
        .pop {
          position: static;
          width: auto;
          grid-column: 1 / -1;
          order: 99;
          box-shadow: none;
        }
        .legend { position: static; grid-column: 1 / -1; order: 100; }
        .rdgrid { grid-template-columns: 1fr; }
      }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .col { font-size: 12px; }
      .acard { border: 1px solid #24354d; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
      .acard.sel { border-color: var(--accent); }
      .acard.dead { opacity: 0.6; }
      .acard h4 { margin: 0 0 4px; color: #e8eef8; }
      .acard small { color: #7d8aa0; display: block; margin: 2px 0; }
      .chip {
        display: inline-block;
        background: #14202f;
        border: 1px solid #2c4058;
        padding: 2px 6px;
        margin: 2px 4px 2px 0;
        font-size: 11px;
      }
      .chip.cyan { border-color: #0e7490; color: var(--persuaded); }
      .chip.gold { border-color: #7a6420; color: var(--gold); }
      .chip b { color: var(--bad); margin-left: 6px; cursor: pointer; }
      .row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; padding: 3px 0; }
      .row small { color: #7d8aa0; }
      .row i { color: #45526b; font-size: 11px; }
      .btnrow { margin-top: 16px; display: flex; justify-content: space-between; }
      .debrief .good { color: var(--good); }
      .debrief .bad { color: var(--bad); }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud"></div>
    <div id="screen"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

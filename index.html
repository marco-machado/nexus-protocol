<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nexus Protocol</title>
    <style>
      :root {
        --accent: #00e5ff;
        --good: #38d47a;
        --warn: #e8b23a;
        --bad: #ef4444;
        --persuaded: #22d3ee;
        --gold: #facc15;
        /* UI chrome lives in a centered 16:9 usable box; the 3D canvas and
           world-tracking overlays (nameplates, offscreen arrows, selection
           box) stay full-window */
        --ui-inset-x: max(0px, calc((100vw - (16 / 9) * 100vh) / 2));
        --ui-inset-y: max(0px, calc((100vh - (9 / 16) * 100vw) / 2));
      }
      /* the small-screen layouts predate the 16:9 box and must not shift */
      @media (max-width: 760px) {
        :root {
          --ui-inset-x: 0px;
          --ui-inset-y: 0px;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0d14;
        font-family: 'Menlo', 'Consolas', monospace;
        user-select: none;
      }
      #app {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        inset: var(--ui-inset-y) var(--ui-inset-x);
        pointer-events: none;
        color: #b9c4d6;
        font-size: 12px;
      }
      /* interactive-overlay contract: the HUD container never eats world
         input; only explicit controls opt back in */
      #hud [data-act],
      #hud .panpad {
        pointer-events: auto;
      }
      #hud button[data-act] {
        background: #14202f;
        color: #c7d2e4;
        border: 1px solid #24354d;
        border-radius: 0;
        font: inherit;
        font-size: 10px;
        letter-spacing: 1px;
        text-transform: uppercase;
        padding: 4px 8px;
        margin: 0;
        cursor: pointer;
        min-width: 34px;
      }
      #hud button[data-act]:hover:not(:disabled) { border-color: var(--accent); color: #fff; }
      #hud button[data-act].on {
        background: #063c46;
        border-color: var(--accent);
        color: #aff6ff;
      }
      #hud button[data-act].pressed { background: #0a5666; border-color: #aff6ff; color: #fff; }
      #hud button[data-act]:disabled {
        opacity: 0.35;
        border-color: #1a2635;
        cursor: default;
      }
      .hud-ctl {
        position: absolute;
        right: 12px;
        top: 44px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-end;
        font-size: 10px;
      }
      .hud-ctl .ctlrow { display: flex; gap: 4px; }
      .hud-ctl .ctllabel {
        color: #55627a;
        font-size: 9px;
        letter-spacing: 1.5px;
        align-self: flex-end;
        margin-top: 3px;
      }
      .railbox {
        position: relative;
        background: rgba(9, 14, 23, 0.85);
        border: 1px solid #24354d;
        padding: 8px 10px;
      }
      .modes button { min-width: 66px; }
      .ordergrid {
        display: grid;
        grid-template-columns: repeat(3, 58px);
        gap: 4px;
      }
      #hud .ordergrid button[data-act] {
        min-width: 0;
        height: 46px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 3px 0;
      }
      .ordergrid svg { width: 16px; height: 16px; }
      .ordergrid i { font-style: normal; font-size: 8px; letter-spacing: 1px; color: #7d8aa0; }
      #hud .ordergrid button.on i,
      #hud .ordergrid button:hover:not(:disabled) i { color: inherit; }
      .speedbar {
        position: fixed;
        right: calc(12px + var(--ui-inset-x));
        bottom: calc(8px + var(--ui-inset-y));
        display: flex;
        gap: 4px;
      }
      .panpad {
        display: grid;
        grid-template-columns: repeat(3, 28px);
        grid-template-rows: repeat(2, 24px);
        gap: 3px;
      }
      .panpad button[data-act] { min-width: 0; padding: 2px 0; }
      .panpad .pu { grid-column: 2; grid-row: 1; }
      .panpad .pl { grid-column: 1; grid-row: 2; }
      .panpad .pd { grid-column: 2; grid-row: 2; }
      .panpad .pr { grid-column: 3; grid-row: 2; }
      .panpad .rl { grid-column: 1; grid-row: 1; }
      .panpad .rr { grid-column: 3; grid-row: 1; }
      /* nameplates: projected in-world labels, never interactive */
      #nameplates {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 12;
        overflow: hidden;
      }
      .plate {
        position: absolute;
        transform: translate(-50%, -100%);
        background: rgba(10, 16, 26, 0.78);
        border: 1px solid #24354d;
        color: #c7d2e4;
        font-size: 10px;
        letter-spacing: 1.2px;
        padding: 1px 6px;
        white-space: nowrap;
      }
      .plate.sel { border-color: var(--accent); color: #e8fbff; }
      .plate.sel::before { content: '\25B8 '; color: var(--accent); }
      .plate.wound { border-color: var(--plate-wound); color: var(--plate-wound); }
      .plate.down {
        border-color: var(--plate-down);
        color: var(--plate-down);
        text-decoration: line-through;
        opacity: 0.8;
      }
      .hud-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 7px 12px;
        background: linear-gradient(180deg, rgba(8, 12, 20, 0.92), rgba(8, 12, 20, 0.55));
        border-bottom: 1px solid #1a2635;
      }
      .hud-top .spacer { flex: 1; }
      .op {
        color: #e8eef8;
        letter-spacing: 1px;
        border-left: 3px solid var(--accent);
        padding: 2px 0 2px 8px;
      }
      .alarm { padding: 2px 8px; letter-spacing: 1px; color: #8fa3bd; }
      .alarm.a0 b { color: var(--good); }
      .alarm.a1 b { color: var(--warn); }
      .alarm.a2 b { color: var(--bad); }
      .inf { color: #8fa3bd; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
      .inf b { color: var(--persuaded); }
      .meter {
        display: inline-block;
        width: 90px;
        height: 6px;
        background: #1a2433;
        position: relative;
        overflow: hidden;
      }
      .meter i {
        display: block;
        height: 100%;
        background: var(--persuaded);
        transition: width 0.4s;
      }
      .meter::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(90deg, transparent 0 8px, #0a0d14 8px 9px);
      }
      .clock { color: #c7d2e4; letter-spacing: 1px; }
      .pausechip {
        color: var(--gold);
        border: 1px solid var(--gold);
        padding: 2px 8px;
        letter-spacing: 1px;
      }
      .simchip { color: var(--warn); letter-spacing: 1px; }
      .status { color: var(--gold); font-size: 15px; font-weight: bold; padding: 2px 10px; }
      #hud button.icobtn[data-act] { min-width: 0; padding: 3px 6px; line-height: 0; }
      .icobtn svg { width: 13px; height: 13px; }
      .panel-box {
        position: absolute;
        background: rgba(9, 14, 23, 0.85);
        border: 1px solid #24354d;
        padding: 8px 10px;
      }
      .panel-box::before {
        content: '';
        position: absolute;
        top: -1px;
        left: -1px;
        width: 8px;
        height: 8px;
        border-top: 2px solid var(--accent);
        border-left: 2px solid var(--accent);
      }
      .panel-box::after {
        content: '';
        position: absolute;
        bottom: -1px;
        right: -1px;
        width: 8px;
        height: 8px;
        border-bottom: 2px solid var(--accent);
        border-right: 2px solid var(--accent);
      }
      .panel-box h4,
      .railbox h4 {
        margin: 0 0 6px;
        font-size: 9px;
        font-weight: normal;
        letter-spacing: 2px;
        color: #55627a;
      }
      .railbox h4:not(:first-child) { margin-top: 8px; }
      .hud-obj { top: 44px; left: 12px; min-width: 180px; }
      .hud-obj ul { margin: 0; padding: 0 0 0 14px; color: #c7d2e4; }
      .hud-obj li { margin: 2px 0; }
      .hud-sys { left: 12px; bottom: 34px; width: 200px; }
      .syswave {
        display: block;
        background: rgba(10, 16, 26, 0.6);
        border: 1px solid #1a2635;
        margin-bottom: 6px;
      }
      .systabs { display: flex; gap: 3px; }
      #hud .systabs button[data-act] { min-width: 0; flex: 1; padding: 3px 0; font-size: 9px; }
      .hud-agents {
        position: absolute;
        left: 236px;
        right: 236px;
        bottom: 34px;
        display: flex;
        gap: 8px;
      }
      .acard { display: flex; gap: 8px; }
      .portrait {
        width: 46px;
        height: 58px;
        object-fit: cover;
        border: 1px solid #24354d;
        background: #0a0f18;
      }
      .agent.sel .portrait { border-color: var(--accent); }
      .abody { flex: 1; min-width: 0; overflow: hidden; }
      .blabel {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 8px;
        letter-spacing: 1.5px;
        color: #55627a;
        margin-top: 4px;
      }
      .blabel b { color: #8fa3bd; font-weight: normal; letter-spacing: 0.5px; }
      .hpbar.focus i { background: var(--persuaded); }
      .akit .chip { color: #8fa3bd; border: 1px solid #24354d; padding: 1px 4px; font-size: 9px; }
      .akit .wpn svg { width: 18px; height: 13px; vertical-align: -3px; margin-right: 3px; }
      .agent {
        background: linear-gradient(180deg, rgba(14, 22, 36, 0.92), rgba(9, 14, 23, 0.88));
        border: 1px solid #24354d;
        border-top: 2px solid #31465f;
        padding: 6px 9px 7px;
        flex: 1 1 160px;
        min-width: 0;
        max-width: 215px;
      }
      .agent.sel { border-color: var(--accent); border-top-color: var(--accent); box-shadow: 0 0 12px rgba(0, 229, 255, 0.18); }
      .agent.dead { opacity: 0.45; border-top-color: var(--bad); }
      .arow { display: flex; align-items: baseline; gap: 7px; }
      .arow b { color: #e8eef8; letter-spacing: 1px; }
      .ahp { color: #b9c4d6; font-size: 11px; }
      .arow em {
        font-style: normal;
        font-size: 9px;
        letter-spacing: 0.5px;
        padding: 1px 4px;
        border: 1px solid currentcolor;
      }
      .b-cloak { color: var(--persuaded); }
      .b-jam { color: var(--bad); }
      .b-drive { color: var(--warn); }
      .b-shield { color: var(--accent); }
      .akit {
        display: flex;
        gap: 4px;
        align-items: center;
        color: #7d8aa0;
        font-size: 10px;
        margin-top: 4px;
        white-space: nowrap;
      }
      .akit .wpn { color: #a8b6cc; }
      .akit .agg { color: #8fa3bd; letter-spacing: 0.5px; }
      /* card controls stay chip-sized so the cards keep their footprint */
      #hud .akit button[data-act] {
        padding: 1px 4px;
        min-width: 0;
        font-size: 9px;
        letter-spacing: 0.5px;
      }
      #hud .akit button.wpn[data-act] { color: #a8b6cc; }
      #hud .akit button.agg[data-act] { color: #8fa3bd; }
      .hpbar {
        display: block;
        height: 3px;
        background: #26303f;
        margin-top: 4px;
      }
      .hpbar i {
        display: block;
        height: 3px;
        background: var(--good);
        transition: width 0.25s;
      }
      .hpbar.low i { background: var(--warn); }
      .hpbar.crit i { background: var(--bad); }
      .hud-help {
        position: absolute;
        bottom: 8px;
        left: 12px;
        right: 260px;
        display: none;
        flex-wrap: wrap;
        gap: 4px 14px;
        color: #55627a;
        font-size: 10px;
      }
      #hud.show-help .hud-help { display: flex; }
      .kgroup { white-space: nowrap; }
      .kgroup b {
        color: #8fa3bd;
        font-weight: normal;
        background: #131c2b;
        border: 1px solid #24354d;
        border-radius: 2px;
        padding: 0 4px;
        margin: 0 4px 0 10px;
      }
      .kgroup b:first-child { margin-left: 0; }
      .minimap {
        position: fixed;
        right: 12px;
        bottom: 34px;
        z-index: 15;
        pointer-events: none;
        border: 1px solid #24354d;
        background: #0a0d14;
        opacity: 0.92;
      }
      .minimap-wrap {
        position: fixed;
        right: calc(12px + var(--ui-inset-x));
        bottom: calc(40px + var(--ui-inset-y));
        z-index: 15;
        padding: 6px 8px 8px;
      }
      .minimap-wrap h4 {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 5px;
      }
      .mmz { display: flex; gap: 3px; }
      #hud .mmz button[data-act] { min-width: 22px; padding: 0 4px; font-size: 11px; }
      .minimap-wrap .minimap {
        position: static;
        display: block;
        border: 1px solid #1a2635;
      }
      @media (max-width: 700px) {
        /* keyboard hints are meaningless on touch-size viewports and the
           bottom band gets crowded: shrink the minimap, tighten the cards */
        .hud-help,
        #hud.show-help .hud-help { display: none; }
        .hud-sys { display: none; }
        .minimap { width: 104px; height: 104px; }
        .minimap-wrap { bottom: 44px; }
        .hud-agents {
          left: 8px;
          right: 130px;
          bottom: 40px;
          flex-wrap: wrap;
          gap: 5px;
        }
        .agent { min-width: 100px; padding: 4px 6px; }
        .portrait { display: none; }
        .akit { gap: 5px; font-size: 9px; }
        .ordergrid { grid-template-columns: repeat(3, 44px); }
        #hud .ordergrid button[data-act] { height: 38px; }
        .ordergrid i { display: none; }
      }
      .comms {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(130px + var(--ui-inset-y));
        z-index: 16;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: center;
      }
      .commline {
        color: #e8eef8;
        background: rgba(10, 16, 26, 0.85);
        border-left: 3px solid var(--accent);
        padding: 5px 12px;
        font-size: 12px;
        opacity: 1;
        transition: opacity 0.6s;
      }
      .offarrow {
        position: fixed;
        width: 0;
        height: 0;
        border: 8px solid transparent;
        border-left-width: 14px;
        pointer-events: none;
        z-index: 14;
        transform-origin: 50% 50%;
      }
      .selbox {
        position: fixed;
        border: 1px solid var(--accent);
        background: rgba(0, 229, 255, 0.08);
        pointer-events: none;
        z-index: 10;
      }
      #screen {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(6, 9, 14, 0.94);
        color: #c7d2e4;
        z-index: 20;
        overflow: auto;
      }
      .panel {
        max-width: 860px;
        width: 92%;
        max-height: 92vh;
        overflow: auto;
        background: #0c111b;
        border: 1px solid #24354d;
        border-top: 3px solid var(--accent);
        padding: 22px 28px;
      }
      .panel h1 {
        font-size: 40px;
        letter-spacing: 6px;
        color: #e8eef8;
        margin: 0 0 4px;
      }
      .panel h1 span { color: var(--accent); margin-left: 10px; }
      .panel h2 { color: #e8eef8; letter-spacing: 2px; margin: 0; }
      .panel h3 { color: #7d8aa0; font-size: 12px; letter-spacing: 2px; margin: 14px 0 6px; }
      .panel .tag { color: #7d8aa0; }
      .panel .fine { color: #45526b; font-size: 10px; margin-top: 24px; }
      .panel button {
        display: inline-block;
        background: #14202f;
        color: #c7d2e4;
        border: 1px solid #2c4058;
        font: inherit;
        padding: 8px 16px;
        margin: 6px 6px 0 0;
        cursor: pointer;
      }
      .panel button:hover:not(:disabled) { border-color: var(--accent); color: #fff; }
      .panel button:disabled { opacity: 0.35; cursor: default; }
      .panel button.primary { background: #063c46; border-color: var(--accent); color: #aff6ff; }
      .menu { text-align: center; }
      .menu button { display: block; margin: 10px auto 0; min-width: 260px; }
      .menu .logo {
        display: block;
        width: 190px;
        height: 142px;
        /* crop the baked-in wordmark off the square mark; the h1 supplies it */
        object-fit: cover;
        object-position: top;
        margin: 0 auto 6px;
        /* the generated mark ships on its own near-black plate; screen
           blending sinks the plate into the panel */
        mix-blend-mode: screen;
      }
      .topbar { display: flex; gap: 18px; align-items: center; margin-bottom: 12px; }
      .credits { color: var(--gold); font-weight: bold; }
      .regiontabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
      .regiontabs button { padding: 4px 10px; font-size: 11px; margin: 0; }
      .neutral { color: #7d8aa0; }
      .siege { color: var(--bad); font-weight: bold; letter-spacing: 1px; margin-bottom: 4px; }
      .hqtag { color: var(--gold); font-size: 10px; letter-spacing: 1px; }
      .sietag { color: var(--bad); font-size: 10px; letter-spacing: 1px; }
      .own { color: var(--good); }
      .riv { color: var(--bad); }
      .unrest.hot { color: var(--bad); }
      .taxrow { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
      .taxrow input { flex: 1; }
      .loglines { color: #5f86b0; font-size: 11px; margin-top: 12px; line-height: 1.7; }
      /* ---- Global Operations: live command globe behind an HUD frame ---- */
      #screen.mapmode {
        background: transparent;
        pointer-events: none;
      }
      .mapframe {
        position: fixed;
        inset: var(--ui-inset-y) var(--ui-inset-x);
        display: flex;
        flex-direction: column;
        color: #c7d2e4;
      }
      .mapframe > * { position: relative; z-index: 1; }
      .mapscrim {
        position: fixed;
        left: var(--ui-inset-x);
        right: var(--ui-inset-x);
        pointer-events: none;
        z-index: 0;
      }
      .mapscrim.top {
        top: var(--ui-inset-y);
        height: 200px;
        background: linear-gradient(180deg, rgba(6, 9, 14, 0.92) 0%, rgba(6, 9, 14, 0.5) 46%, rgba(6, 9, 14, 0) 100%);
      }
      .mapscrim.bottom {
        bottom: var(--ui-inset-y);
        height: 220px;
        background: linear-gradient(0deg, rgba(6, 9, 14, 0.94) 0%, rgba(6, 9, 14, 0.5) 50%, rgba(6, 9, 14, 0) 100%);
      }
      .maphud {
        display: flex;
        align-items: stretch;
        gap: 10px 22px;
        flex-wrap: wrap;
        padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px
          calc(16px + env(safe-area-inset-left));
        pointer-events: auto;
      }
      .maphud-brand { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
      .maphud-brand .glyph {
        width: 22px;
        height: 22px;
        position: relative;
        border: 1px solid var(--accent);
        box-shadow: inset 0 0 8px rgba(0, 229, 255, 0.4), 0 0 8px rgba(0, 229, 255, 0.25);
      }
      .maphud-brand .glyph::after {
        content: '';
        position: absolute;
        inset: 5px;
        border: 1px solid var(--accent);
        opacity: 0.7;
      }
      .maphud h2 { font-size: 15px; letter-spacing: 3px; color: #e8eef8; }
      .maphud .stat { display: flex; flex-direction: column; justify-content: center; min-width: 74px; }
      .maphud .stat label { font-size: 9px; letter-spacing: 1.5px; color: #6c7c96; }
      .maphud .stat b { font-size: 15px; letter-spacing: 0.5px; color: #e8eef8; font-variant-numeric: tabular-nums; }
      .maphud .stat b small { font-size: 9px; color: #6c7c96; margin-left: 2px; letter-spacing: 0; }
      .maphud .stat b.credits { color: var(--gold); }
      .maphud .stat b.good { color: var(--good); }
      .maphud .stat b.accentv { color: var(--accent); }
      .maphud .stat b.muted { color: #7d8aa0; font-size: 12px; }

      .regiontabs {
        display: flex;
        gap: 4px;
        padding: 0 12px;
        overflow-x: auto;
        scrollbar-width: none;
        pointer-events: auto;
      }
      .regiontabs::-webkit-scrollbar { display: none; }
      .rtab {
        flex: 0 0 auto;
        min-height: 44px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 2px;
        background: rgba(12, 17, 27, 0.72);
        border: 1px solid #24354d;
        border-top: 2px solid #24354d;
        color: #8fa3bd;
        font: inherit;
        font-size: 11px;
        letter-spacing: 1px;
        padding: 4px 12px;
        margin: 0;
        cursor: pointer;
        white-space: nowrap;
      }
      .rtab b { font-weight: normal; font-size: 9px; color: #6c7c96; letter-spacing: 1px; }
      .rtab:hover:not(:disabled) { border-color: var(--accent); color: #fff; }
      .rtab.primary { border-top-color: var(--accent); color: #aff6ff; background: rgba(6, 60, 70, 0.5); }
      .rtab.primary b { color: var(--accent); }
      .rtab:disabled { opacity: 0.4; cursor: default; }

      .mapbody { flex: 1; position: relative; min-height: 0; display: flex; pointer-events: none; }
      .mapcenter {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 14px;
        gap: 8px;
        pointer-events: none;
      }
      .charter {
        color: #6f86a8;
        font-size: 10.5px;
        letter-spacing: 0.5px;
        text-align: center;
        background: rgba(6, 9, 14, 0.5);
        padding: 3px 10px;
      }
      .maphint { color: #45526b; font-size: 10px; letter-spacing: 2px; }

      .terrlist {
        width: 268px;
        align-self: stretch;
        margin: 12px 0 12px 12px;
        display: flex;
        flex-direction: column;
        background: rgba(10, 14, 22, 0.78);
        border: 1px solid #223247;
        border-left: 2px solid var(--accent);
        backdrop-filter: blur(3px);
        pointer-events: auto;
        overflow: hidden;
      }
      .terrlist-h {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 10px 12px;
        border-bottom: 1px solid #1b2940;
        color: #e8eef8;
        font-size: 12px;
        letter-spacing: 1.5px;
      }
      .terrlist-cnt { color: var(--good); font-size: 10px; letter-spacing: 1px; }
      .terrlist-body { overflow-y: auto; }
      .trow {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 8px;
        width: 100%;
        min-height: 46px;
        text-align: left;
        background: transparent;
        border: 0;
        border-left: 3px solid transparent;
        border-bottom: 1px solid #141d2c;
        color: #c7d2e4;
        font: inherit;
        padding: 7px 12px;
        margin: 0;
        cursor: pointer;
      }
      .trow:hover { background: rgba(0, 229, 255, 0.05); }
      .trow.sel { background: rgba(0, 229, 255, 0.1); border-left-color: var(--accent); }
      .trow.own { border-left-color: var(--good); }
      .trow.riv { border-left-color: var(--bad); }
      .trow.own.sel, .trow.riv.sel { border-left-color: var(--accent); }
      .trow-top { display: flex; align-items: center; gap: 6px; font-size: 11.5px; letter-spacing: 0.5px; color: #dbe6f5; }
      .trow-sub { grid-column: 1; color: #8fa3bd; font-size: 10.5px; }
      .trow-ub {
        grid-row: 1 / span 2;
        grid-column: 2;
        align-self: center;
        width: 40px;
        height: 4px;
        background: #1c2942;
        position: relative;
      }
      .trow-ub .ub { position: absolute; left: 0; top: 0; bottom: 0; background: var(--good); }
      .trow-ub .ub.hot { background: var(--bad); }
      .trow .own { color: var(--good); font-size: 9px; letter-spacing: 1px; }
      .trow .riv { color: var(--bad); font-size: 9px; letter-spacing: 1px; }
      .trow .neu { color: #7d8aa0; font-size: 9px; letter-spacing: 1px; }
      .trow .hqtag { color: var(--gold); font-size: 8.5px; }
      .trow .sietag { color: var(--bad); font-size: 8.5px; }

      .detailwrap { width: 300px; align-self: flex-start; margin: 12px 12px 0 0; pointer-events: none; }
      .pop {
        pointer-events: auto;
        background: rgba(10, 14, 22, 0.9);
        border: 1px solid var(--accent);
        border-top: 2px solid var(--accent);
        padding: 12px 14px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        font-size: 12px;
        backdrop-filter: blur(4px);
      }
      .pop-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
      .pop h4 { margin: 0; color: #e8eef8; font-size: 12.5px; letter-spacing: 0.05em; }
      .pop-x {
        background: none;
        border: 0;
        color: #7d8aa0;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        padding: 0 2px;
        margin: -2px -2px 0 0;
      }
      .pop-x:hover { color: var(--accent); }
      .pop .own { color: var(--good); font-size: 10px; letter-spacing: 1px; margin-top: 2px; }
      .pop .riv { color: var(--bad); font-size: 10px; letter-spacing: 1px; margin-top: 2px; }
      .pop .neutral { color: #7d8aa0; font-size: 10px; letter-spacing: 1px; margin-top: 2px; }
      .pop dl { margin: 10px 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 11.5px; }
      .pop dt { color: #7d8aa0; }
      .pop dd { margin: 0; text-align: right; }
      .pop dd.unrest.hot { color: var(--bad); }
      .pop .siege { color: var(--bad); font-weight: bold; letter-spacing: 1px; margin: 6px 0; }
      .pop .hqtag { color: var(--gold); font-size: 10px; letter-spacing: 1px; }
      .pop .taxrow { margin: 8px 0; }
      .pop button { width: 100%; margin: 6px 0 0; min-height: 40px; }
      .pop .fine { margin: 8px 0 0; }

      .legend {
        position: absolute;
        left: 16px;
        bottom: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        font-size: 10px;
        letter-spacing: 0.5px;
        color: #8fa3bd;
        background: rgba(6, 9, 14, 0.55);
        padding: 6px 10px;
        pointer-events: none;
      }
      .legend span { display: flex; align-items: center; }
      .legend .sw { display: inline-block; width: 9px; height: 9px; margin-right: 5px; box-shadow: 0 0 6px currentColor; }

      .drawer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        padding: 9px 16px;
        background: rgba(9, 13, 20, 0.82);
        border-top: 1px solid #24354d;
        color: #7d8aa0;
        font-size: 11.5px;
        pointer-events: auto;
      }
      .drawer > span:first-child { color: var(--accent); letter-spacing: 1.5px; }
      .drawer b { color: #c7d2e4; }
      .drawer input { flex: 1; min-width: 120px; }
      .drawer button { margin: 0; padding: 6px 12px; font-size: 11px; min-height: 34px; }
      .rdgrid { flex-basis: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 24px; font-size: 11px; }
      .rdgrid div { display: flex; align-items: center; gap: 6px; }
      .rdgrid progress { flex: 1; height: 6px; }
      .ticker {
        padding: 7px 16px calc(7px + env(safe-area-inset-bottom));
        background: rgba(6, 9, 14, 0.82);
        border-top: 1px solid #1b2940;
        color: #5f86b0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 11.5px;
        pointer-events: auto;
      }

      @media (max-width: 760px) {
        .maphud { gap: 6px 14px; padding-bottom: 8px; }
        .maphud h2 { font-size: 13px; }
        .maphud .stat { min-width: 56px; }
        .maphud .stat b { font-size: 13px; }
        .mapbody { flex-direction: column; }
        .terrlist { width: auto; margin: 8px 8px 0; max-height: 32vh; }
        .mapcenter { flex: none; min-height: 88px; order: 4; }
        .detailwrap { width: auto; margin: 8px 8px 0; order: 5; }
        .legend { position: static; margin: 4px 8px 0; align-self: flex-start; order: 6; }
        .rdgrid { grid-template-columns: 1fr; }
      }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .col { font-size: 12px; }
      .acard { border: 1px solid #24354d; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
      .acard.sel { border-color: var(--accent); }
      .acard.dead { opacity: 0.6; }
      .acard h4 { margin: 0 0 4px; color: #e8eef8; }
      .acard small { color: #7d8aa0; display: block; margin: 2px 0; }
      .chip {
        display: inline-block;
        background: #14202f;
        border: 1px solid #2c4058;
        padding: 2px 6px;
        margin: 2px 4px 2px 0;
        font-size: 11px;
      }
      .chip.cyan { border-color: #0e7490; color: var(--persuaded); }
      .chip.gold { border-color: #7a6420; color: var(--gold); }
      .chip b { color: var(--bad); margin-left: 6px; cursor: pointer; }
      .row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; padding: 3px 0; }
      .row small { color: #7d8aa0; }
      .row i { color: #45526b; font-size: 11px; }
      .btnrow { margin-top: 16px; display: flex; justify-content: space-between; }
      .debrief .good { color: var(--good); }
      .debrief .bad { color: var(--bad); }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud"></div>
    <div id="screen"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: ci

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Serial files keep the wall-clock flashmob probe (tests/flashmobDensity.test.ts)
      # from contending with parallel test workers on 2-core runners; see docs/perf.md.
      - run: npm test -- --fileParallelism=false
